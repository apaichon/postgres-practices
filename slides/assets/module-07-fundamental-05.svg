<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" role="img" aria-labelledby="title desc"><title id="title">ห่วงโซ่ของ point-in-time recovery</title><desc id="desc">Physical base: มีอยู่ก่อน target → WAL chain: ต่อเนื่องถึงจุดที่ต้องการ → Recovery target: replay จนถึงจุดที่ระบุ; </desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#2d9fe7"/></marker></defs><g font-family="Noto Sans Thai,Arial,sans-serif"><rect x="15.0" y="35" width="300.0" height="160" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><text x="165.0" y="76" font-size="24" fill="#18395f" font-weight="700" text-anchor="middle">Physical base</text><text x="165.0" y="135" font-size="20" fill="#18395f" text-anchor="middle">มีอยู่ก่อน target</text><path d="M315.0 115 H344.0" fill="none" stroke="#2d9fe7" stroke-width="3" marker-end="url(#arrow)"/><rect x="350.0" y="35" width="300.0" height="160" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><text x="500.0" y="76" font-size="24" fill="#18395f" font-weight="700" text-anchor="middle">WAL chain</text><text x="500.0" y="135" font-size="20" fill="#18395f" text-anchor="middle">ต่อเนื่องถึงจุดที่ต้องการ</text><path d="M650.0 115 H679.0" fill="none" stroke="#2d9fe7" stroke-width="3" marker-end="url(#arrow)"/><rect x="685.0" y="35" width="300.0" height="160" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><text x="835.0" y="76" font-size="24" fill="#18395f" font-weight="700" text-anchor="middle">Recovery target</text><text x="835.0" y="135" font-size="20" fill="#18395f" text-anchor="middle">replay จนถึงจุดที่ระบุ</text></g></svg>