<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-labelledby="title desc"><title id="title">Index คือ access path เพิ่มเติม</title><desc id="desc">B-tree รองรับ equality range ordering; GIN รองรับ containment และ full-text; BRIN สรุปช่วง blocks แบบ lossy; INCLUDE เป็นคอลัมน์ payload และ index-only scan ขึ้นกับ visibility map</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#2d9fe7"/></marker></defs><g font-family="Noto Sans Thai,Arial,sans-serif"><rect x="15" y="18" width="250" height="62" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><text x="35" y="58" font-size="26" fill="#18395f" font-weight="700">B-tree</text><path d="M265 49 H305" fill="none" stroke="#2d9fe7" stroke-width="3" marker-end="url(#arrow)"/><text x="325" y="58" font-size="23" fill="#18395f">equality / range / ordering</text><rect x="15" y="96" width="250" height="62" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><text x="35" y="136" font-size="26" fill="#18395f" font-weight="700">GIN</text><path d="M265 127 H305" fill="none" stroke="#2d9fe7" stroke-width="3" marker-end="url(#arrow)"/><text x="325" y="136" font-size="23" fill="#18395f">JSONB containment / full-text</text><rect x="15" y="174" width="250" height="62" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><text x="35" y="214" font-size="26" fill="#18395f" font-weight="700">BRIN</text><path d="M265 205 H305" fill="none" stroke="#2d9fe7" stroke-width="3" marker-end="url(#arrow)"/><text x="325" y="214" font-size="23" fill="#18395f">สรุปช่วง blocks · ต้อง recheck</text><text x="20" y="288" font-size="22" fill="#18395f" font-weight="700">INCLUDE: เก็บค่าผลลัพธ์ใน index · Index-only scan ยังพึ่ง visibility map</text></g></svg>