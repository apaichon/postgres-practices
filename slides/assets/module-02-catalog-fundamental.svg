<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-labelledby="title desc"><title id="title">Catalog และชนิด routine</title><desc id="desc">Join pg_namespace กับ pg_proc ด้วย namespace OID แล้วอ่าน prokind f เป็น function และ p เป็น procedure; กรองสามชื่อของบทนี้</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#2d9fe7"/></marker></defs><g font-family="Noto Sans Thai,Arial,sans-serif"><rect x="15" y="25" width="300" height="100" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><text x="165" y="68" font-size="26" fill="#18395f" font-weight="700" text-anchor="middle">pg_namespace</text><text x="165" y="105" font-size="21" fill="#18395f" text-anchor="middle">nspname = &#x27;claimsure&#x27;</text><rect x="350" y="25" width="300" height="100" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><text x="500" y="68" font-size="26" fill="#18395f" font-weight="700" text-anchor="middle">pg_proc</text><text x="500" y="105" font-size="21" fill="#18395f" text-anchor="middle">pronamespace = n.oid</text><rect x="685" y="25" width="300" height="100" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><text x="835" y="68" font-size="26" fill="#18395f" font-weight="700" text-anchor="middle">prokind</text><text x="835" y="105" font-size="21" fill="#18395f" text-anchor="middle">&#x27;f&#x27; หรือ &#x27;p&#x27;</text><path d="M315 76 H340" fill="none" stroke="#2d9fe7" stroke-width="3" marker-end="url(#arrow)"/><path d="M650 76 H675" fill="none" stroke="#2d9fe7" stroke-width="3" marker-end="url(#arrow)"/><text x="20" y="186" font-size="26" fill="#18395f" font-weight="700">f → function</text><text x="310" y="186" font-size="24" fill="#18395f">claim_tax · claims_by_status</text><text x="20" y="238" font-size="26" fill="#18395f" font-weight="700">p → procedure</text><text x="310" y="238" font-size="24" fill="#18395f">review_claim</text><text x="20" y="295" font-size="22" fill="#18395f" font-weight="700">กรอง schema + ชื่อ routines → ควรพบ 2 functions และ 1 procedure</text></g></svg>