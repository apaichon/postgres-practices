<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" role="img" aria-labelledby="title desc"><title id="title">Transaction และ ACID</title><desc id="desc">BEGIN → UPDATE → ตรวจผล → เลือก COMMIT หรือ ROLLBACK; ACID อธิบาย atomicity consistency isolation และ durability</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#2d9fe7"/></marker></defs><g font-family="Noto Sans Thai,Arial,sans-serif"><rect x="15" y="25" width="215" height="100" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><text x="122" y="65" font-size="26" font-weight="700" fill="#18395f" text-anchor="middle">BEGIN</text><text x="122" y="103" font-size="20" fill="#18395f" text-anchor="middle">เริ่ม transaction</text><path d="M230 75 H255" fill="none" stroke="#2d9fe7" stroke-width="3" marker-end="url(#arrow)"/><rect x="265" y="25" width="215" height="100" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><text x="372" y="65" font-size="26" font-weight="700" fill="#18395f" text-anchor="middle">UPDATE</text><text x="372" y="103" font-size="20" fill="#18395f" text-anchor="middle">เปลี่ยนเคลม</text><path d="M480 75 H505" fill="none" stroke="#2d9fe7" stroke-width="3" marker-end="url(#arrow)"/><rect x="515" y="25" width="215" height="100" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><text x="622" y="65" font-size="26" font-weight="700" fill="#18395f" text-anchor="middle">VERIFY</text><text x="622" y="103" font-size="20" fill="#18395f" text-anchor="middle">อ่าน RETURNING</text><path d="M730 75 H747 V41 H760" fill="none" stroke="#2d9fe7" stroke-width="3" marker-end="url(#arrow)"/><rect x="765" y="8" width="220" height="66" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><text x="875" y="48" font-size="25" font-weight="700" fill="#18395f" text-anchor="middle">COMMIT</text><rect x="765" y="96" width="220" height="66" rx="10" fill="#f3efff" stroke="#a18bd4" stroke-width="2"/><text x="875" y="137" font-size="25" font-weight="700" fill="#18395f" text-anchor="middle">ROLLBACK</text><path d="M747 75 V129 H760" fill="none" stroke="#2d9fe7" stroke-width="3" marker-end="url(#arrow)"/><text x="20" y="205" font-size="22" font-weight="700" fill="#18395f">A · Atomicity</text><text x="20" y="234" font-size="20" fill="#18395f">สำเร็จทั้งชุดหรือย้อนกลับ</text><text x="525" y="205" font-size="22" font-weight="700" fill="#18395f">C · Consistency</text><text x="525" y="234" font-size="20" fill="#18395f">ผ่านข้อจำกัดที่นิยามไว้</text><text x="20" y="278" font-size="22" font-weight="700" fill="#18395f">I · Isolation</text><text x="20" y="307" font-size="20" fill="#18395f">การเห็นข้อมูลตาม isolation level</text><text x="525" y="278" font-size="22" font-weight="700" fill="#18395f">D · Durability</text><text x="525" y="307" font-size="20" fill="#18395f">คงทนตาม WAL / settings</text></g></svg>