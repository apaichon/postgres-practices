<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc"><title id="title">Memory budget มีหลายขอบเขต</title><desc id="desc">shared_buffers → cache ร่วมของ instance → OS cache และ memory ส่วนอื่น; work_mem → ฐานงบต่อ sort/hash operation → หลาย operations / workers / sessions; maintenance_work_mem → งาน maintenance ที่เกี่ยวข้อง → จำนวนงานที่เกิดพร้อมกัน</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#2d9fe7"/></marker></defs><g font-family="Noto Sans Thai,Arial,sans-serif"><rect x="15" y="10" width="300" height="76" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><path d="M315 48 H350" fill="none" stroke="#2d9fe7" stroke-width="3" marker-end="url(#arrow)"/><text x="32" y="40" font-size="22" fill="#18395f" font-weight="700">shared_buffers</text><text x="370" y="39" font-size="21" fill="#18395f" font-weight="700">cache ร่วมของ instance</text><text x="370" y="63" font-size="21" fill="#18395f">OS cache และ memory ส่วนอื่น</text><rect x="15" y="98" width="300" height="76" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><path d="M315 136 H350" fill="none" stroke="#2d9fe7" stroke-width="3" marker-end="url(#arrow)"/><text x="32" y="128" font-size="22" fill="#18395f" font-weight="700">work_mem</text><text x="370" y="127" font-size="21" fill="#18395f" font-weight="700">ฐานงบต่อ sort/hash operation</text><text x="370" y="151" font-size="21" fill="#18395f">หลาย operations / workers / sessions</text><rect x="15" y="186" width="300" height="76" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><path d="M315 224 H350" fill="none" stroke="#2d9fe7" stroke-width="3" marker-end="url(#arrow)"/><text x="32" y="216" font-size="22" fill="#18395f" font-weight="700">maintenance_work_mem</text><text x="370" y="215" font-size="21" fill="#18395f" font-weight="700">งาน maintenance ที่เกี่ยวข้อง</text><text x="370" y="239" font-size="21" fill="#18395f">จำนวนงานที่เกิดพร้อมกัน</text></g></svg>