<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-labelledby="title desc"><title id="title">Statistics และ row versions</title><desc id="desc">ANALYZE เก็บสถิติสำหรับ planner; VACUUM จัดการ versions ที่ไม่ต้องใช้และ visibility map; autovacuum จัดงานตามเงื่อนไข และ old snapshots อาจทำให้ versions ยังจำเป็น</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#2d9fe7"/></marker></defs><g font-family="Noto Sans Thai,Arial,sans-serif"><rect x="15" y="25" width="460" height="205" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><text x="35" y="72" font-size="28" fill="#18395f" font-weight="700">ANALYZE</text><text x="35" y="117" font-size="22" fill="#18395f">เก็บสถิติของข้อมูล</text><text x="35" y="157" font-size="22" fill="#18395f">planner ประมาณ rows</text><text x="35" y="197" font-size="22" fill="#18395f">ไม่ได้สร้าง index</text><rect x="525" y="25" width="460" height="205" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><text x="545" y="72" font-size="28" fill="#18395f" font-weight="700">VACUUM</text><text x="545" y="117" font-size="22" fill="#18395f">เก็บกวาด versions ที่ไม่ต้องใช้</text><text x="545" y="157" font-size="22" fill="#18395f">พื้นที่กลับมาใช้ภายใน</text><text x="545" y="197" font-size="22" fill="#18395f">ดูแล visibility map</text><text x="20" y="282" font-size="21" fill="#18395f" font-weight="700">Autovacuum จัด vacuum / analyze ตามเงื่อนไข · old snapshot อาจกีดกัน cleanup</text></g></svg>