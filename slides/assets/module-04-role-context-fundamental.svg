<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-labelledby="title desc"><title id="title">Login identity และ effective role</title><desc id="desc">session_user ยังเป็น student_xx; current_user เปลี่ยนเป็น cs_actor_xx หลัง SET LOCAL ROLE และกลับเมื่อ RESET ROLE หรือ transaction สิ้นสุด</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#2d9fe7"/></marker></defs><g font-family="Noto Sans Thai,Arial,sans-serif"><rect x="15" y="30" width="300" height="150" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><text x="165" y="74" font-size="24" fill="#18395f" font-weight="700" text-anchor="middle">Login</text><text x="165" y="119" font-size="20" fill="#18395f" text-anchor="middle">current_user</text><text x="165" y="154" font-size="25" fill="#18395f" font-weight="700" text-anchor="middle">student_xx</text><rect x="350" y="30" width="300" height="150" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><text x="500" y="74" font-size="24" fill="#18395f" font-weight="700" text-anchor="middle">SET LOCAL ROLE</text><text x="500" y="119" font-size="20" fill="#18395f" text-anchor="middle">current_user</text><text x="500" y="154" font-size="25" fill="#18395f" font-weight="700" text-anchor="middle">cs_actor_xx</text><rect x="685" y="30" width="300" height="150" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><text x="835" y="74" font-size="24" fill="#18395f" font-weight="700" text-anchor="middle">RESET / ROLLBACK</text><text x="835" y="119" font-size="20" fill="#18395f" text-anchor="middle">current_user</text><text x="835" y="154" font-size="25" fill="#18395f" font-weight="700" text-anchor="middle">student_xx</text><path d="M315 104 H340" fill="none" stroke="#2d9fe7" stroke-width="3" marker-end="url(#arrow)"/><path d="M650 104 H675" fill="none" stroke="#2d9fe7" stroke-width="3" marker-end="url(#arrow)"/><text x="20" y="239" font-size="25" fill="#18395f" font-weight="700">session_user = student_xx ตลอดการทดลอง SET ROLE นี้</text><text x="20" y="290" font-size="22" fill="#18395f">INHERIT กับสิทธิ์ SET ROLE เป็นคนละ option ของ membership</text></g></svg>