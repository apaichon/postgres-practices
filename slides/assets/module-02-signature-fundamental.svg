<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" role="img" aria-labelledby="title desc"><title id="title">Signature และภาษาของ routine</title><desc id="desc">ชื่อและชนิด input arguments ใช้แยก overload; RETURNS อธิบายผลของ function; LANGUAGE sql หรือ plpgsql อธิบายภาษาที่ใช้; Procedure เรียกด้วย CALL</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#2d9fe7"/></marker></defs><g font-family="Noto Sans Thai,Arial,sans-serif"><rect x="15" y="25" width="970" height="84" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><text x="32" y="56" font-size="22" fill="#18395f" font-weight="700">claim_tax(numeric, numeric, numeric)</text><text x="32" y="90" font-size="21" fill="#18395f">RETURNS numeric</text><text x="650" y="90" font-size="21" fill="#18395f" font-weight="700">LANGUAGE sql</text><rect x="15" y="127" width="970" height="84" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><text x="32" y="158" font-size="22" fill="#18395f" font-weight="700">claims_by_status(text)</text><text x="32" y="192" font-size="21" fill="#18395f">RETURNS TABLE (...)</text><text x="650" y="192" font-size="21" fill="#18395f" font-weight="700">LANGUAGE plpgsql</text><rect x="15" y="229" width="970" height="84" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><text x="32" y="260" font-size="22" fill="#18395f" font-weight="700">review_claim(text, numeric)</text><text x="32" y="294" font-size="21" fill="#18395f">เรียกด้วย CALL</text><text x="650" y="294" font-size="21" fill="#18395f" font-weight="700">LANGUAGE plpgsql</text></g></svg>