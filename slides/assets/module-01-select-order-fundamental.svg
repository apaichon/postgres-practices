<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-labelledby="title desc"><title id="title">ลำดับคิดของ SELECT</title><desc id="desc">FROM/JOIN → WHERE → GROUP BY → HAVING → SELECT → ORDER BY → LIMIT เป็น logical model ไม่ใช่ physical execution plan</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#2d9fe7"/></marker></defs><g font-family="Noto Sans Thai,Arial,sans-serif"><rect x="10" y="35" width="178" height="120" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><text x="99" y="79" font-size="20" font-weight="700" fill="#18395f" text-anchor="middle">FROM / JOIN</text><text x="99" y="119" font-size="18" fill="#18395f" text-anchor="middle">อ่านและจับคู่แถว</text><path d="M188 95 H208" fill="none" stroke="#2d9fe7" stroke-width="3" marker-end="url(#arrow)"/><rect x="211" y="35" width="178" height="120" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><text x="300" y="79" font-size="20" font-weight="700" fill="#18395f" text-anchor="middle">WHERE</text><text x="300" y="119" font-size="18" fill="#18395f" text-anchor="middle">กรองแต่ละแถว</text><path d="M389 95 H409" fill="none" stroke="#2d9fe7" stroke-width="3" marker-end="url(#arrow)"/><rect x="412" y="35" width="178" height="120" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><text x="501" y="79" font-size="20" font-weight="700" fill="#18395f" text-anchor="middle">GROUP BY</text><text x="501" y="119" font-size="18" fill="#18395f" text-anchor="middle">รวมกลุ่ม</text><path d="M590 95 H610" fill="none" stroke="#2d9fe7" stroke-width="3" marker-end="url(#arrow)"/><rect x="613" y="35" width="178" height="120" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><text x="702" y="79" font-size="20" font-weight="700" fill="#18395f" text-anchor="middle">HAVING</text><text x="702" y="119" font-size="18" fill="#18395f" text-anchor="middle">กรองกลุ่ม</text><path d="M791 95 H811" fill="none" stroke="#2d9fe7" stroke-width="3" marker-end="url(#arrow)"/><rect x="814" y="35" width="178" height="120" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><text x="903" y="79" font-size="20" font-weight="700" fill="#18395f" text-anchor="middle">SELECT</text><text x="903" y="119" font-size="18" fill="#18395f" text-anchor="middle">คำนวณผล</text><rect x="555" y="198" width="425" height="82" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><text x="767" y="232" font-size="24" font-weight="700" fill="#18395f" text-anchor="middle">ORDER BY → LIMIT</text><text x="767" y="263" font-size="20" fill="#18395f" text-anchor="middle">จัดลำดับ แล้วจำกัดจำนวนแถว</text><path d="M901 155 V173 H530 V239 H550" fill="none" stroke="#2d9fe7" stroke-width="3" marker-end="url(#arrow)"/><text x="20" y="232" font-size="23" font-weight="700" fill="#18395f">Logical processing order</text><text x="20" y="270" font-size="21" fill="#18395f">ใช้ช่วยอ่าน query ในบท 1</text></g></svg>