<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="368" viewBox="0 0 1000 368" role="img" aria-labelledby="title desc"><title id="title">Lexical search กับ vector retrieval</title><desc id="desc">ตัวแทนข้อมูล → lexemes / tsvector → embedding vector(n); จับความเกี่ยวข้อง → คำและ text-search configuration → distance จากโมเดล; ดัชนีตัวอย่าง → GIN → HNSW แบบ approximate; ต้องตรวจเพิ่ม → ภาษา / ranking → model / dimensions / recall + filter</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#2d9fe7"/></marker></defs><g font-family="Noto Sans Thai,Arial,sans-serif"><rect x="15" y="10" width="300" height="76" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><path d="M315 48 H350" fill="none" stroke="#2d9fe7" stroke-width="3" marker-end="url(#arrow)"/><text x="32" y="40" font-size="22" fill="#18395f" font-weight="700">ตัวแทนข้อมูล</text><text x="370" y="39" font-size="21" fill="#18395f" font-weight="700">lexemes / tsvector</text><text x="370" y="63" font-size="21" fill="#18395f">embedding vector(n)</text><rect x="15" y="98" width="300" height="76" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><path d="M315 136 H350" fill="none" stroke="#2d9fe7" stroke-width="3" marker-end="url(#arrow)"/><text x="32" y="128" font-size="22" fill="#18395f" font-weight="700">จับความเกี่ยวข้อง</text><text x="370" y="127" font-size="21" fill="#18395f" font-weight="700">คำและ text-search configuration</text><text x="370" y="151" font-size="21" fill="#18395f">distance จากโมเดล</text><rect x="15" y="186" width="300" height="76" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><path d="M315 224 H350" fill="none" stroke="#2d9fe7" stroke-width="3" marker-end="url(#arrow)"/><text x="32" y="216" font-size="22" fill="#18395f" font-weight="700">ดัชนีตัวอย่าง</text><text x="370" y="215" font-size="21" fill="#18395f" font-weight="700">GIN</text><text x="370" y="239" font-size="21" fill="#18395f">HNSW แบบ approximate</text><rect x="15" y="274" width="300" height="76" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><path d="M315 312 H350" fill="none" stroke="#2d9fe7" stroke-width="3" marker-end="url(#arrow)"/><text x="32" y="304" font-size="22" fill="#18395f" font-weight="700">ต้องตรวจเพิ่ม</text><text x="370" y="303" font-size="21" fill="#18395f" font-weight="700">ภาษา / ranking</text><text x="370" y="327" font-size="21" fill="#18395f">model / dimensions / recall + filter</text></g></svg>