<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc"><title id="title">Steps 5 / 10–11 · Fundamental: Slots and WAL</title><desc id="desc">One replica → one slot → Slot retains WAL still needed by that replica; Replica stopped → Inactive slot may keep retaining WAL; Replica retired → Verify retirement before dropping its inactive slot</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#2d9fe7"/></marker></defs><g font-family="Noto Sans Thai,Arial,sans-serif"><rect x="15" y="10" width="300" height="76" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><path d="M315 48 H350" fill="none" stroke="#2d9fe7" stroke-width="3" marker-end="url(#arrow)"/><text x="32" y="40" font-size="22" fill="#18395f" font-weight="700">One replica → one slot</text><text x="370" y="55" font-size="21" fill="#18395f" font-weight="700">Slot retains WAL still needed by that replica</text><rect x="15" y="98" width="300" height="76" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><path d="M315 136 H350" fill="none" stroke="#2d9fe7" stroke-width="3" marker-end="url(#arrow)"/><text x="32" y="128" font-size="22" fill="#18395f" font-weight="700">Replica stopped</text><text x="370" y="143" font-size="21" fill="#18395f" font-weight="700">Inactive slot may keep retaining WAL</text><rect x="15" y="186" width="300" height="76" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><path d="M315 224 H350" fill="none" stroke="#2d9fe7" stroke-width="3" marker-end="url(#arrow)"/><text x="32" y="216" font-size="22" fill="#18395f" font-weight="700">Replica retired</text><text x="370" y="215" font-size="21" fill="#18395f" font-weight="700">Verify retirement before dropping its inactive</text><text x="370" y="239" font-size="21" fill="#18395f">slot</text></g></svg>