<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-labelledby="title desc"><title id="title">Object privileges และ row policy</title><desc id="desc">Schema USAGE เปิด namespace; object grants อนุญาต operation; RLS จำกัดแถวสำหรับ operation ที่ได้รับอนุญาตแล้ว</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#2d9fe7"/></marker></defs><g font-family="Noto Sans Thai,Arial,sans-serif"><rect x="15" y="35" width="300" height="170" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><text x="165" y="82" font-size="26" fill="#18395f" font-weight="700" text-anchor="middle">Schema USAGE</text><text x="165" y="128" font-size="20" fill="#18395f" text-anchor="middle">เข้าถึง namespace</text><text x="165" y="165" font-size="20" fill="#18395f" text-anchor="middle">claimsure</text><rect x="350" y="35" width="300" height="170" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><text x="500" y="82" font-size="26" fill="#18395f" font-weight="700" text-anchor="middle">Object privilege</text><text x="500" y="128" font-size="20" fill="#18395f" text-anchor="middle">ทำ operation ที่อนุญาต</text><text x="500" y="165" font-size="20" fill="#18395f" text-anchor="middle">SELECT / INSERT / UPDATE</text><rect x="685" y="35" width="300" height="170" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><text x="835" y="82" font-size="26" fill="#18395f" font-weight="700" text-anchor="middle">RLS policy</text><text x="835" y="128" font-size="20" fill="#18395f" text-anchor="middle">เลือกแถวที่มองเห็น/เขียนได้</text><text x="835" y="165" font-size="20" fill="#18395f" text-anchor="middle">USING / WITH CHECK</text><path d="M315 118 H340" fill="none" stroke="#2d9fe7" stroke-width="3" marker-end="url(#arrow)"/><path d="M650 118 H675" fill="none" stroke="#2d9fe7" stroke-width="3" marker-end="url(#arrow)"/><text x="20" y="269" font-size="22" fill="#18395f" font-weight="700">RLS ไม่ได้ GRANT SELECT ให้เอง · เมื่ออยู่ภายใต้ RLS ต้องมี policy ที่ใช้ได้</text></g></svg>