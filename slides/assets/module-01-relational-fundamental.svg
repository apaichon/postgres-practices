<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="310" viewBox="0 0 1000 310" role="img" aria-labelledby="title desc"><title id="title">Relational model ของ ClaimSure</title><desc id="desc">customer หนึ่งรายมีหลาย policy และ policy หนึ่งฉบับมีหลาย claim; PK ระบุแถว และ FK อ้างอิง parent ที่มีอยู่</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#2d9fe7"/></marker></defs><g font-family="Noto Sans Thai,Arial,sans-serif"><text x="20" y="32" font-size="24" font-weight="700" fill="#18395f">SCHEMA claimsure</text><rect x="20" y="58" width="270" height="183" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><text x="38" y="94" font-size="28" font-weight="700" fill="#18395f">customer</text><text x="38" y="135" font-size="21" fill="#18395f">customer_id  PK</text><text x="38" y="172" font-size="21" fill="#18395f">customer_code  UNIQUE</text><text x="38" y="209" font-size="21" fill="#18395f">full_name  text</text><rect x="365" y="58" width="270" height="183" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><text x="383" y="94" font-size="28" font-weight="700" fill="#18395f">policy</text><text x="383" y="135" font-size="21" fill="#18395f">policy_id  PK</text><text x="383" y="172" font-size="21" fill="#18395f">customer_id  FK</text><text x="383" y="209" font-size="21" fill="#18395f">policy_no  UNIQUE</text><rect x="710" y="58" width="270" height="183" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><text x="728" y="94" font-size="28" font-weight="700" fill="#18395f">claim</text><text x="728" y="135" font-size="21" fill="#18395f">claim_id  PK</text><text x="728" y="172" font-size="21" fill="#18395f">policy_id  FK</text><text x="728" y="209" font-size="21" fill="#18395f">status  text</text><path d="M290 150 H355" fill="none" stroke="#2d9fe7" stroke-width="3" marker-end="url(#arrow)"/><text x="322" y="125" font-size="18" font-weight="700" fill="#18395f" text-anchor="middle">1 : N</text><path d="M635 150 H700" fill="none" stroke="#2d9fe7" stroke-width="3" marker-end="url(#arrow)"/><text x="667" y="125" font-size="18" font-weight="700" fill="#18395f" text-anchor="middle">1 : N</text><text x="20" y="282" font-size="21" fill="#18395f">Table = ชนิดข้อมูล · Row = หนึ่งรายการ · Column + type = คุณสมบัติและชนิดค่า</text></g></svg>