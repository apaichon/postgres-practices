<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-labelledby="title desc"><title id="title">การนำ SQL กลับมาใช้</title><desc id="desc">Expression → Query → Named object; View เป็นสัญญาคอลัมน์ Function มี arguments และผลที่คืน Procedure เรียกงานด้วย CALL</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#2d9fe7"/></marker></defs><g font-family="Noto Sans Thai,Arial,sans-serif"><rect x="20" y="25" width="270" height="100" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><text x="155" y="67" font-size="27" fill="#18395f" font-weight="700" text-anchor="middle">Expression</text><text x="155" y="103" font-size="21" fill="#18395f" text-anchor="middle">คำนวณค่าหนึ่งส่วน</text><rect x="365" y="25" width="270" height="100" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><text x="500" y="67" font-size="27" fill="#18395f" font-weight="700" text-anchor="middle">Query</text><text x="500" y="103" font-size="21" fill="#18395f" text-anchor="middle">ประกอบชุดผลลัพธ์</text><rect x="710" y="25" width="270" height="100" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><text x="845" y="67" font-size="27" fill="#18395f" font-weight="700" text-anchor="middle">Named object</text><text x="845" y="103" font-size="21" fill="#18395f" text-anchor="middle">ตั้งชื่อสัญญาที่ใช้ซ้ำ</text><path d="M290 75 H350" fill="none" stroke="#2d9fe7" stroke-width="3" marker-end="url(#arrow)"/><path d="M635 75 H695" fill="none" stroke="#2d9fe7" stroke-width="3" marker-end="url(#arrow)"/><text x="32" y="185" font-size="26" fill="#18395f" font-weight="700">View</text><text x="32" y="228" font-size="22" fill="#18395f">claim_detail_v</text><text x="32" y="265" font-size="22" fill="#18395f">คอลัมน์ + ชนิดข้อมูล</text><text x="377" y="185" font-size="26" fill="#18395f" font-weight="700">Function</text><text x="377" y="228" font-size="22" fill="#18395f">claim_tax(...)</text><text x="377" y="265" font-size="22" fill="#18395f">arguments + ผลที่คืน</text><text x="722" y="185" font-size="26" fill="#18395f" font-weight="700">Procedure</text><text x="722" y="228" font-size="22" fill="#18395f">review_claim(...)</text><text x="722" y="265" font-size="22" fill="#18395f">งานที่เรียกด้วย CALL</text></g></svg>