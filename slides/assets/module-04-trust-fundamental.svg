<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-labelledby="title desc"><title id="title">Trusted context และ least privilege</title><desc id="desc">ระบบจริงตรวจตัวตนก่อนส่ง context; custom GUC ในแล็บตั้งเองได้และไม่ใช่ authentication; จำกัดสิทธิ์และทดสอบข้ามขอบเขตด้วย role จริง</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#2d9fe7"/></marker></defs><g font-family="Noto Sans Thai,Arial,sans-serif"><rect x="15" y="35" width="300" height="170" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><text x="165" y="82" font-size="26" fill="#18395f" font-weight="700" text-anchor="middle">ตรวจตัวตน</text><text x="165" y="128" font-size="20" fill="#18395f" text-anchor="middle">ระบบจริงตรวจผู้ใช้</text><text x="165" y="165" font-size="20" fill="#18395f" text-anchor="middle">ก่อนกำหนด context</text><rect x="350" y="35" width="300" height="170" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><text x="500" y="82" font-size="26" fill="#18395f" font-weight="700" text-anchor="middle">Trusted context</text><text x="500" y="128" font-size="20" fill="#18395f" text-anchor="middle">app.customer_id</text><text x="500" y="165" font-size="20" fill="#18395f" text-anchor="middle">แล็บ: นักเรียน SET เอง</text><rect x="685" y="35" width="300" height="170" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><text x="835" y="82" font-size="26" fill="#18395f" font-weight="700" text-anchor="middle">Least privilege</text><text x="835" y="128" font-size="20" fill="#18395f" text-anchor="middle">เฉพาะ operation / columns</text><text x="835" y="165" font-size="20" fill="#18395f" text-anchor="middle">ทดสอบอ่านและเขียนข้ามลูกค้า</text><path d="M315 118 H340" fill="none" stroke="#2d9fe7" stroke-width="3" marker-end="url(#arrow)"/><path d="M650 118 H675" fill="none" stroke="#2d9fe7" stroke-width="3" marker-end="url(#arrow)"/><text x="20" y="269" font-size="23" fill="#18395f" font-weight="700">custom GUC เป็น context simulation ไม่ได้ verify ผู้ใช้ด้วยตัวมันเอง</text></g></svg>