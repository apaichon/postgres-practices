<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-labelledby="title desc"><title id="title">ขอบเขตการวัด WAL และ relation path</title><desc id="desc">LSN ก่อนและหลัง INSERT ใช้หาความต่าง WAL ของช่วงเวลาทั้ง shared cluster ไม่ใช่เฉพาะคำสั่งนี้และไม่พิสูจน์ flush; relation path เป็นของ server</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#2d9fe7"/></marker></defs><g font-family="Noto Sans Thai,Arial,sans-serif"><rect x="15" y="25" width="300" height="100" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><text x="165" y="68" font-size="25" fill="#18395f" font-weight="700" text-anchor="middle">before_lsn</text><text x="165" y="105" font-size="22" fill="#18395f" text-anchor="middle">ก่อน INSERT</text><rect x="350" y="25" width="300" height="100" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><text x="500" y="68" font-size="25" fill="#18395f" font-weight="700" text-anchor="middle">INSERT 1,000 แถว</text><text x="500" y="105" font-size="22" fill="#18395f" text-anchor="middle">CLM-L5-*</text><rect x="685" y="25" width="300" height="100" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><text x="835" y="68" font-size="25" fill="#18395f" font-weight="700" text-anchor="middle">after_lsn</text><text x="835" y="105" font-size="22" fill="#18395f" text-anchor="middle">หลัง INSERT</text><path d="M315 76 H340" fill="none" stroke="#2d9fe7" stroke-width="3" marker-end="url(#arrow)"/><path d="M650 76 H675" fill="none" stroke="#2d9fe7" stroke-width="3" marker-end="url(#arrow)"/><text x="20" y="180" font-size="22" fill="#18395f" font-weight="700">pg_wal_lsn_diff(after, before) = WAL ของช่วงเวลาบน shared cluster</text><text x="20" y="228" font-size="22" fill="#18395f">insert LSN ไม่ได้พิสูจน์ WAL flush · อาจรวมงานของนักเรียนคนอื่น</text><text x="20" y="281" font-size="22" fill="#18395f" font-weight="700">pg_relation_filepath(claim) เป็น path ของ relation บน server</text></g></svg>