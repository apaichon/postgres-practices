<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-labelledby="title desc"><title id="title">CTE, View และผลที่เก็บไว้</title><desc id="desc">CTE อยู่ใน statement; temporary table อยู่ตาม session หรือ transaction options; view เก็บ definition; materialized view เก็บผลและเปลี่ยนเมื่อ refresh</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#2d9fe7"/></marker></defs><g font-family="Noto Sans Thai,Arial,sans-serif"><rect x="15" y="12" width="300" height="64" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><text x="32" y="53" font-size="24" fill="#18395f" font-weight="700">CTE</text><path d="M315 44 H350" fill="none" stroke="#2d9fe7" stroke-width="3" marker-end="url(#arrow)"/><text x="365" y="36" font-size="20" fill="#18395f" font-weight="700">WITH name AS (...)</text><text x="365" y="67" font-size="22" fill="#18395f">ชื่อผลภายในคำสั่งเดียว</text><rect x="15" y="91" width="300" height="64" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><text x="32" y="132" font-size="24" fill="#18395f" font-weight="700">Temporary table</text><path d="M315 123 H350" fill="none" stroke="#2d9fe7" stroke-width="3" marker-end="url(#arrow)"/><text x="365" y="115" font-size="20" fill="#18395f" font-weight="700">CREATE TEMP TABLE</text><text x="365" y="146" font-size="22" fill="#18395f">อายุ session / transaction ตาม options</text><rect x="15" y="170" width="300" height="64" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><text x="32" y="211" font-size="24" fill="#18395f" font-weight="700">View</text><path d="M315 202 H350" fill="none" stroke="#2d9fe7" stroke-width="3" marker-end="url(#arrow)"/><text x="365" y="194" font-size="20" fill="#18395f" font-weight="700">CREATE VIEW</text><text x="365" y="225" font-size="22" fill="#18395f">เก็บ definition · ไม่เก็บสำเนาผล</text><rect x="15" y="249" width="300" height="64" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><text x="32" y="290" font-size="24" fill="#18395f" font-weight="700">Materialized view</text><path d="M315 281 H350" fill="none" stroke="#2d9fe7" stroke-width="3" marker-end="url(#arrow)"/><text x="365" y="273" font-size="20" fill="#18395f" font-weight="700">CREATE MATERIALIZED VIEW</text><text x="365" y="304" font-size="22" fill="#18395f">เก็บผล · เปลี่ยนเมื่อ REFRESH</text></g></svg>