<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="368" viewBox="0 0 1000 368" role="img" aria-labelledby="title desc"><title id="title">การมีผล: SET, reload หรือ restart</title><desc id="desc">user / superuser → เปลี่ยนใน session ตามสิทธิ์ → work_mem / logging บางค่า; backend / superuser-backend → ต้องเป็น connection ใหม่ → ตรวจ context ของค่านั้น; sighup → อ่าน config ใหม่เมื่อ reload → max_wal_size; postmaster → มีผลเมื่อ server restart → shared_buffers</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#2d9fe7"/></marker></defs><g font-family="Noto Sans Thai,Arial,sans-serif"><rect x="15" y="10" width="300" height="76" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><path d="M315 48 H350" fill="none" stroke="#2d9fe7" stroke-width="3" marker-end="url(#arrow)"/><text x="32" y="40" font-size="22" fill="#18395f" font-weight="700">user / superuser</text><text x="370" y="39" font-size="21" fill="#18395f" font-weight="700">เปลี่ยนใน session ตามสิทธิ์</text><text x="370" y="63" font-size="21" fill="#18395f">work_mem / logging บางค่า</text><rect x="15" y="98" width="300" height="76" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><path d="M315 136 H350" fill="none" stroke="#2d9fe7" stroke-width="3" marker-end="url(#arrow)"/><text x="32" y="128" font-size="22" fill="#18395f" font-weight="700">backend /</text><text x="32" y="153" font-size="22" fill="#18395f" font-weight="700">superuser-backend</text><text x="370" y="127" font-size="21" fill="#18395f" font-weight="700">ต้องเป็น connection ใหม่</text><text x="370" y="151" font-size="21" fill="#18395f">ตรวจ context ของค่านั้น</text><rect x="15" y="186" width="300" height="76" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><path d="M315 224 H350" fill="none" stroke="#2d9fe7" stroke-width="3" marker-end="url(#arrow)"/><text x="32" y="216" font-size="22" fill="#18395f" font-weight="700">sighup</text><text x="370" y="215" font-size="21" fill="#18395f" font-weight="700">อ่าน config ใหม่เมื่อ reload</text><text x="370" y="239" font-size="21" fill="#18395f">max_wal_size</text><rect x="15" y="274" width="300" height="76" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><path d="M315 312 H350" fill="none" stroke="#2d9fe7" stroke-width="3" marker-end="url(#arrow)"/><text x="32" y="304" font-size="22" fill="#18395f" font-weight="700">postmaster</text><text x="370" y="303" font-size="21" fill="#18395f" font-weight="700">มีผลเมื่อ server restart</text><text x="370" y="327" font-size="21" fill="#18395f">shared_buffers</text></g></svg>