<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-labelledby="title desc"><title id="title">กลุ่มคำสั่ง SQL</title><desc id="desc">สี่กลุ่มงาน: นิยามโครงสร้าง อ่านข้อมูล เปลี่ยนข้อมูล และควบคุม transaction</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#2d9fe7"/></marker></defs><g font-family="Noto Sans Thai,Arial,sans-serif"><rect x="15" y="34" width="220" height="200" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><text x="30" y="78" font-size="25" font-weight="700" fill="#18395f">Structure</text><rect x="265" y="34" width="220" height="200" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><text x="280" y="78" font-size="25" font-weight="700" fill="#18395f">Read</text><rect x="515" y="34" width="220" height="200" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><text x="530" y="78" font-size="25" font-weight="700" fill="#18395f">Change rows</text><rect x="765" y="34" width="220" height="200" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><text x="780" y="78" font-size="25" font-weight="700" fill="#18395f">Transaction</text><text x="20" y="285" font-size="23" font-weight="700" fill="#18395f">เลือกคำสั่งตามงาน → ตรวจ database / schema → รัน → อ่านผล</text><text x="30" y="128" font-size="20" fill="#18395f">CREATE / ALTER</text><text x="30" y="164" font-size="20" fill="#18395f">DROP</text><text x="30" y="204" font-size="20" fill="#18395f">นิยามโครงสร้าง</text><text x="280" y="128" font-size="20" fill="#18395f">SELECT</text><text x="280" y="204" font-size="20" fill="#18395f">อ่านผล query</text><text x="530" y="128" font-size="20" fill="#18395f">INSERT / UPDATE</text><text x="530" y="164" font-size="20" fill="#18395f">DELETE</text><text x="530" y="204" font-size="20" fill="#18395f">เปลี่ยนแถว</text><text x="780" y="128" font-size="20" fill="#18395f">BEGIN / COMMIT</text><text x="780" y="164" font-size="20" fill="#18395f">ROLLBACK</text><text x="780" y="204" font-size="20" fill="#18395f">ยืนยัน / ย้อนกลับ</text></g></svg>