<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-labelledby="title desc"><title id="title">Partitioning และผลรายงานที่เก็บไว้</title><desc id="desc">Partitioning route แถวตาม key ไม่ใช่ผลสรุป; Materialized view เก็บผล query และเปลี่ยนเมื่อ refresh; Report copy เป็นสำเนาที่ต้อง sync เมื่อ source เปลี่ยน</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#2d9fe7"/></marker></defs><g font-family="Noto Sans Thai,Arial,sans-serif"><rect x="15" y="15" width="310" height="84" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><text x="32" y="64" font-size="24" fill="#18395f" font-weight="700">Partitioned table</text><path d="M325 57 H365" fill="none" stroke="#2d9fe7" stroke-width="3" marker-end="url(#arrow)"/><text x="385" y="45" font-size="24" fill="#18395f" font-weight="700">route แถวตาม key / bounds</text><text x="385" y="82" font-size="22" fill="#18395f">Jan / Feb / Mar · ตรวจ pruning</text><rect x="15" y="117" width="310" height="84" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><text x="32" y="166" font-size="24" fill="#18395f" font-weight="700">Materialized view</text><path d="M325 159 H365" fill="none" stroke="#2d9fe7" stroke-width="3" marker-end="url(#arrow)"/><text x="385" y="147" font-size="24" fill="#18395f" font-weight="700">เก็บผล query ที่คำนวณไว้</text><text x="385" y="184" font-size="22" fill="#18395f">ข้อมูลสดตาม REFRESH ล่าสุด</text><rect x="15" y="219" width="310" height="84" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><text x="32" y="268" font-size="24" fill="#18395f" font-weight="700">Report copy</text><path d="M325 261 H365" fill="none" stroke="#2d9fe7" stroke-width="3" marker-end="url(#arrow)"/><text x="385" y="249" font-size="24" fill="#18395f" font-weight="700">INSERT ... SELECT จาก source</text><text x="385" y="286" font-size="22" fill="#18395f">source เปลี่ยน → ต้องมีแผน sync</text></g></svg>