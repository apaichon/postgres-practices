<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" role="img" aria-labelledby="title desc"><title id="title">Statement timeout และ lock timeout</title><desc id="desc">statement_timeout: จำกัดเวลาคำสั่งทั้งหมด → lock_timeout: จำกัดช่วงที่รอ lock → SAVEPOINT / ROLLBACK: คืน transaction หลัง expected error; 6C: 57014 สำหรับ statement timeout · 55P03 สำหรับ lock timeout</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#2d9fe7"/></marker></defs><g font-family="Noto Sans Thai,Arial,sans-serif"><rect x="15.0" y="35" width="300.0" height="160" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><text x="165.0" y="76" font-size="24" fill="#18395f" font-weight="700" text-anchor="middle">statement_timeout</text><text x="165.0" y="135" font-size="20" fill="#18395f" text-anchor="middle">จำกัดเวลาคำสั่งทั้งหมด</text><path d="M315.0 115 H344.0" fill="none" stroke="#2d9fe7" stroke-width="3" marker-end="url(#arrow)"/><rect x="350.0" y="35" width="300.0" height="160" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><text x="500.0" y="76" font-size="24" fill="#18395f" font-weight="700" text-anchor="middle">lock_timeout</text><text x="500.0" y="135" font-size="20" fill="#18395f" text-anchor="middle">จำกัดช่วงที่รอ lock</text><path d="M650.0 115 H679.0" fill="none" stroke="#2d9fe7" stroke-width="3" marker-end="url(#arrow)"/><rect x="685.0" y="35" width="300.0" height="160" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><text x="835.0" y="76" font-size="24" fill="#18395f" font-weight="700" text-anchor="middle">SAVEPOINT / ROLLBACK</text><text x="835.0" y="135" font-size="20" fill="#18395f" text-anchor="middle">คืน transaction หลัง</text><text x="835.0" y="162" font-size="20" fill="#18395f" text-anchor="middle">expected error</text><text x="20" y="250" font-size="23" fill="#18395f" font-weight="700">6C: 57014 สำหรับ statement timeout · 55P03 สำหรับ lock timeout</text></g></svg>