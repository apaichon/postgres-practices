<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-labelledby="title desc"><title id="title">Estimated plan กับ actual execution</title><desc id="desc">cost และ rows เป็นการประมาณ ส่วน EXPLAIN ANALYZE รันจริงและแสดงเวลาแถวลูปและ buffers; buffer read ไม่ได้พิสูจน์ physical disk I/O โดยตรง</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#2d9fe7"/></marker></defs><g font-family="Noto Sans Thai,Arial,sans-serif"><rect x="15" y="25" width="460" height="205" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><text x="35" y="72" font-size="28" fill="#18395f" font-weight="700">Estimated plan</text><text x="35" y="117" font-size="22" fill="#18395f">cost: หน่วยต้นทุนของ planner</text><text x="35" y="157" font-size="22" fill="#18395f">rows: จำนวนแถวที่ประมาณ</text><text x="35" y="197" font-size="22" fill="#18395f">ไม่ได้เป็น milliseconds</text><rect x="525" y="25" width="460" height="205" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><text x="545" y="72" font-size="28" fill="#18395f" font-weight="700">Actual execution</text><text x="545" y="117" font-size="22" fill="#18395f">ANALYZE: รันคำสั่งจริง</text><text x="545" y="157" font-size="22" fill="#18395f">actual time / rows + loops</text><text x="545" y="197" font-size="22" fill="#18395f">BUFFERS: hit / read</text><text x="20" y="281" font-size="22" fill="#18395f" font-weight="700">เทียบ estimates กับ actual → ดู Scan / Sort / Rows / Buffers / เวลา</text></g></svg>