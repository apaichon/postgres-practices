<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-labelledby="title desc"><title id="title">Default privileges และ object ในอนาคต</title><desc id="desc">Default privileges ผูกกับผู้สร้างและ schema ส่งผลต่อ objects ที่สร้างภายหลัง ไม่ย้อน grant ตารางเก่า; ทดสอบใน transaction แล้ว rollback</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#2d9fe7"/></marker></defs><g font-family="Noto Sans Thai,Arial,sans-serif"><rect x="15" y="35" width="300" height="170" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><text x="165" y="82" font-size="24" fill="#18395f" font-weight="700" text-anchor="middle">Creator + schema</text><text x="165" y="128" font-size="20" fill="#18395f" text-anchor="middle">เจ้าของที่สร้าง object</text><text x="165" y="165" font-size="20" fill="#18395f" text-anchor="middle">IN SCHEMA claimsure</text><rect x="350" y="35" width="300" height="170" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><text x="500" y="82" font-size="24" fill="#18395f" font-weight="700" text-anchor="middle">Default privileges</text><text x="500" y="128" font-size="20" fill="#18395f" text-anchor="middle">GRANT SELECT ON TABLES</text><text x="500" y="165" font-size="20" fill="#18395f" text-anchor="middle">TO cs_reader_xx</text><rect x="685" y="35" width="300" height="170" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><text x="835" y="82" font-size="24" fill="#18395f" font-weight="700" text-anchor="middle">Future table</text><text x="835" y="128" font-size="20" fill="#18395f" text-anchor="middle">cs_future_claim_note</text><text x="835" y="165" font-size="20" fill="#18395f" text-anchor="middle">รับ grant ตอนสร้าง</text><path d="M315 118 H340" fill="none" stroke="#2d9fe7" stroke-width="3" marker-end="url(#arrow)"/><path d="M650 118 H675" fill="none" stroke="#2d9fe7" stroke-width="3" marker-end="url(#arrow)"/><text x="20" y="269" font-size="23" fill="#18395f" font-weight="700">ไม่ย้อนแก้ grants ของตารางเก่า · ทดสอบแล้ว ROLLBACK คืน defaults</text></g></svg>