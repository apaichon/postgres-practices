<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc"><title id="title">Fundamentals: RPO และ RTO</title><desc id="desc">RPO → ต้องกู้ข้อมูลกลับได้ถึงจุดใด → แถวก่อน/หลัง backup และ target; RTO → ต้องกลับมาใช้งานภายในเวลาเท่าไร → เริ่มกู้จนเปิดตรวจใช้งานได้; Recovery evidence → รู้ได้อย่างไรว่ากู้ถูก → keys / totals / state / application</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#2d9fe7"/></marker></defs><g font-family="Noto Sans Thai,Arial,sans-serif"><rect x="15" y="10" width="300" height="76" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><path d="M315 48 H350" fill="none" stroke="#2d9fe7" stroke-width="3" marker-end="url(#arrow)"/><text x="32" y="40" font-size="22" fill="#18395f" font-weight="700">RPO</text><text x="370" y="39" font-size="21" fill="#18395f" font-weight="700">ต้องกู้ข้อมูลกลับได้ถึงจุดใด</text><text x="370" y="63" font-size="21" fill="#18395f">แถวก่อน/หลัง backup และ target</text><rect x="15" y="98" width="300" height="76" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><path d="M315 136 H350" fill="none" stroke="#2d9fe7" stroke-width="3" marker-end="url(#arrow)"/><text x="32" y="128" font-size="22" fill="#18395f" font-weight="700">RTO</text><text x="370" y="127" font-size="21" fill="#18395f" font-weight="700">ต้องกลับมาใช้งานภายในเวลาเท่าไร</text><text x="370" y="151" font-size="21" fill="#18395f">เริ่มกู้จนเปิดตรวจใช้งานได้</text><rect x="15" y="186" width="300" height="76" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><path d="M315 224 H350" fill="none" stroke="#2d9fe7" stroke-width="3" marker-end="url(#arrow)"/><text x="32" y="216" font-size="22" fill="#18395f" font-weight="700">Recovery evidence</text><text x="370" y="215" font-size="21" fill="#18395f" font-weight="700">รู้ได้อย่างไรว่ากู้ถูก</text><text x="370" y="239" font-size="21" fill="#18395f">keys / totals / state / application</text></g></svg>