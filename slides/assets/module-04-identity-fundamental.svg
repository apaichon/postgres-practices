<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-labelledby="title desc"><title id="title">ตัวตน สิทธิ์ และเจ้าของ</title><desc id="desc">Authentication ระบุผู้เชื่อมต่อ Authorization กำหนด operations และ Ownership ควบคุม definition; GRANT ALL ไม่ใช่โอน ownership</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#2d9fe7"/></marker></defs><g font-family="Noto Sans Thai,Arial,sans-serif"><rect x="15" y="15" width="310" height="84" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><text x="32" y="64" font-size="25" fill="#18395f" font-weight="700">Authentication</text><path d="M325 57 H365" fill="none" stroke="#2d9fe7" stroke-width="3" marker-end="url(#arrow)"/><text x="385" y="45" font-size="25" fill="#18395f" font-weight="700">ใครเชื่อมต่อ</text><text x="385" y="82" font-size="23" fill="#18395f">LOGIN: student_xx</text><rect x="15" y="117" width="310" height="84" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><text x="32" y="166" font-size="25" fill="#18395f" font-weight="700">Authorization</text><path d="M325 159 H365" fill="none" stroke="#2d9fe7" stroke-width="3" marker-end="url(#arrow)"/><text x="385" y="147" font-size="25" fill="#18395f" font-weight="700">ทำอะไรกับ object ได้</text><text x="385" y="184" font-size="23" fill="#18395f">SELECT / UPDATE(status)</text><rect x="15" y="219" width="310" height="84" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><text x="32" y="268" font-size="25" fill="#18395f" font-weight="700">Ownership</text><path d="M325 261 H365" fill="none" stroke="#2d9fe7" stroke-width="3" marker-end="url(#arrow)"/><text x="385" y="249" font-size="25" fill="#18395f" font-weight="700">ใครควบคุม definition</text><text x="385" y="286" font-size="23" fill="#18395f">แล็บ: student_xx เป็น owner</text></g></svg>