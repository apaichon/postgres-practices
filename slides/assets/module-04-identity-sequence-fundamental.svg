<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-labelledby="title desc"><title id="title">Identity INSERT และ direct nextval</title><desc id="desc">การ INSERT ให้ identity สร้างค่าไม่ต้อง grant sequence แยก ส่วน direct nextval ต้องมี sequence privilege; sequence อาจข้ามเลขแม้ rollback</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#2d9fe7"/></marker></defs><g font-family="Noto Sans Thai,Arial,sans-serif"><rect x="15" y="25" width="460" height="210" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><text x="35" y="73" font-size="27" fill="#18395f" font-weight="700">INSERT ผ่าน identity</text><text x="35" y="119" font-size="22" fill="#18395f">GENERATED ALWAYS</text><text x="35" y="160" font-size="22" fill="#18395f">ให้ฐานสร้าง claim_id</text><text x="35" y="201" font-size="22" fill="#18395f">ไม่ต้อง grant sequence แยก</text><rect x="525" y="25" width="460" height="210" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><text x="545" y="73" font-size="27" fill="#18395f" font-weight="700">เรียก nextval โดยตรง</text><text x="545" y="119" font-size="22" fill="#18395f">nextval(&#x27;...claim_id_seq&#x27;)</text><text x="545" y="160" font-size="22" fill="#18395f">ต้องมีสิทธิ์บน sequence</text><text x="545" y="201" font-size="22" fill="#18395f">ไม่มีสิทธิ์ → expected 42501</text><text x="20" y="286" font-size="22" fill="#18395f" font-weight="700">ROLLBACK ลบแถวทดลองได้ · sequence อาจข้ามเลข ไม่ต้อง reset ให้ติดกัน</text></g></svg>