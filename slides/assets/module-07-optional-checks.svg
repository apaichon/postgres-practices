<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc"><title id="title">ทางเลือกและการตรวจปัญหา</title><desc id="desc">7.6a: Timestamp target → copy base ไป target ใหม่ → ใช้ target_time แทน target_name เพียงหนึ่งแบบ; 7.6b: Archive / replay → ตรวจ logs, archive และ base ก่อน target → เปรียบเทียบเคลมก่อน/หลังเป้าหมาย; 7.6b: FK / restore → คืน customer → policy → claim บน DDL เดิม → ไม่ข้าม error หรือเติม CASCADE</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#2d9fe7"/></marker></defs><g font-family="Noto Sans Thai,Arial,sans-serif"><rect x="15" y="10" width="300" height="76" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><path d="M315 48 H350" fill="none" stroke="#2d9fe7" stroke-width="3" marker-end="url(#arrow)"/><text x="32" y="40" font-size="22" fill="#18395f" font-weight="700">7.6a: Timestamp target</text><text x="370" y="39" font-size="21" fill="#18395f" font-weight="700">copy base ไป target ใหม่</text><text x="370" y="63" font-size="21" fill="#18395f">ใช้ target_time แทน target_name เพียงหนึ่งแบบ</text><rect x="15" y="98" width="300" height="76" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><path d="M315 136 H350" fill="none" stroke="#2d9fe7" stroke-width="3" marker-end="url(#arrow)"/><text x="32" y="128" font-size="22" fill="#18395f" font-weight="700">7.6b: Archive / replay</text><text x="370" y="127" font-size="21" fill="#18395f" font-weight="700">ตรวจ logs, archive และ base ก่อน target</text><text x="370" y="151" font-size="21" fill="#18395f">เปรียบเทียบเคลมก่อน/หลังเป้าหมาย</text><rect x="15" y="186" width="300" height="76" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><path d="M315 224 H350" fill="none" stroke="#2d9fe7" stroke-width="3" marker-end="url(#arrow)"/><text x="32" y="216" font-size="22" fill="#18395f" font-weight="700">7.6b: FK / restore</text><text x="370" y="215" font-size="21" fill="#18395f" font-weight="700">คืน customer → policy → claim บน DDL เดิม</text><text x="370" y="239" font-size="21" fill="#18395f">ไม่ข้าม error หรือเติม CASCADE</text></g></svg>