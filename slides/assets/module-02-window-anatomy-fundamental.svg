<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" role="img" aria-labelledby="title desc"><title id="title">องค์ประกอบของ Window function</title><desc id="desc">PARTITION BY แบ่งกลุ่ม; ORDER BY เรียงด้วย incident_at และ claim_no; ROWS frame กำหนดยอดสะสม; Outer ORDER BY กำหนดลำดับสุดท้าย</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#2d9fe7"/></marker></defs><g font-family="Noto Sans Thai,Arial,sans-serif"><rect x="15" y="20" width="300" height="130" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><text x="165" y="61" font-size="25" fill="#18395f" font-weight="700" text-anchor="middle">PARTITION BY</text><text x="165" y="99" font-size="20" fill="#18395f" text-anchor="middle">customer_code</text><text x="165" y="130" font-size="20" fill="#18395f" text-anchor="middle">แบ่งกลุ่มคำนวณ</text><rect x="350" y="20" width="300" height="130" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><text x="500" y="61" font-size="25" fill="#18395f" font-weight="700" text-anchor="middle">ORDER BY</text><text x="500" y="99" font-size="20" fill="#18395f" text-anchor="middle">incident_at, claim_no</text><text x="500" y="130" font-size="20" fill="#18395f" text-anchor="middle">เรียงพร้อม tie-breaker</text><rect x="685" y="20" width="300" height="130" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><text x="835" y="61" font-size="25" fill="#18395f" font-weight="700" text-anchor="middle">ROWS frame</text><text x="835" y="99" font-size="20" fill="#18395f" text-anchor="middle">ต้นกลุ่ม → แถวปัจจุบัน</text><text x="835" y="130" font-size="20" fill="#18395f" text-anchor="middle">กำหนดยอดสะสม</text><path d="M315 84 H340" fill="none" stroke="#2d9fe7" stroke-width="3" marker-end="url(#arrow)"/><path d="M650 84 H675" fill="none" stroke="#2d9fe7" stroke-width="3" marker-end="url(#arrow)"/><text x="20" y="201" font-size="24" fill="#18395f" font-weight="700">CUS-001</text><text x="220" y="201" font-size="23" fill="#18395f">001: 15,000</text><path d="M405 194 H460" fill="none" stroke="#2d9fe7" stroke-width="3" marker-end="url(#arrow)"/><text x="480" y="201" font-size="23" fill="#18395f">002: 15,000 + 22,000 = 37,000</text><text x="20" y="257" font-size="23" fill="#18395f">CUS-002 เริ่มกลุ่มใหม่ → 005: 12,000 → 006: 30,000</text><text x="20" y="306" font-size="22" fill="#18395f" font-weight="700">Outer ORDER BY กำหนดลำดับแสดงผลสุดท้ายอีกครั้ง</text></g></svg>