<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc"><title id="title">Logical backup กับ physical backup</title><desc id="desc">Logical: pg_dump → objects/data ของ database ที่เลือก → เลือกคืน objects / ย้ายด้วย SQL format; Physical: base/files → ชุด cluster และ WAL ที่เกี่ยวข้อง → คืน instance และรองรับ PITR; Cluster globals → roles / tablespaces ระดับ cluster → ต้องมีวิธีจัดเก็บแยกเมื่อใช้ pg_dump</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#2d9fe7"/></marker></defs><g font-family="Noto Sans Thai,Arial,sans-serif"><rect x="15" y="10" width="300" height="76" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><path d="M315 48 H350" fill="none" stroke="#2d9fe7" stroke-width="3" marker-end="url(#arrow)"/><text x="32" y="40" font-size="22" fill="#18395f" font-weight="700">Logical: pg_dump</text><text x="370" y="39" font-size="21" fill="#18395f" font-weight="700">objects/data ของ database ที่เลือก</text><text x="370" y="63" font-size="21" fill="#18395f">เลือกคืน objects / ย้ายด้วย SQL format</text><rect x="15" y="98" width="300" height="76" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><path d="M315 136 H350" fill="none" stroke="#2d9fe7" stroke-width="3" marker-end="url(#arrow)"/><text x="32" y="128" font-size="22" fill="#18395f" font-weight="700">Physical: base/files</text><text x="370" y="127" font-size="21" fill="#18395f" font-weight="700">ชุด cluster และ WAL ที่เกี่ยวข้อง</text><text x="370" y="151" font-size="21" fill="#18395f">คืน instance และรองรับ PITR</text><rect x="15" y="186" width="300" height="76" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><path d="M315 224 H350" fill="none" stroke="#2d9fe7" stroke-width="3" marker-end="url(#arrow)"/><text x="32" y="216" font-size="22" fill="#18395f" font-weight="700">Cluster globals</text><text x="370" y="215" font-size="21" fill="#18395f" font-weight="700">roles / tablespaces ระดับ cluster</text><text x="370" y="239" font-size="21" fill="#18395f">ต้องมีวิธีจัดเก็บแยกเมื่อใช้ pg_dump</text></g></svg>