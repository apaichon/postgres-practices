<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-labelledby="title desc"><title id="title">NULL และตรรกะสามค่า</title><desc id="desc">ตัวอย่างสามแถว NULL, 0, 7500: COUNT(*) เท่ากับ 3; COUNT(approved_amount) เท่ากับ 2; WHERE เก็บเฉพาะ TRUE</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#2d9fe7"/></marker></defs><g font-family="Noto Sans Thai,Arial,sans-serif"><text x="20" y="32" font-size="24" font-weight="700" fill="#18395f">approved_amount</text><rect x="20" y="55" width="300" height="105" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><text x="170" y="103" font-size="32" font-weight="700" fill="#18395f" text-anchor="middle">NULL</text><text x="170" y="139" font-size="20" fill="#18395f" text-anchor="middle">ยังไม่มีค่าที่ทราบ</text><rect x="350" y="55" width="300" height="105" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><text x="500" y="103" font-size="32" font-weight="700" fill="#18395f" text-anchor="middle">0</text><text x="500" y="139" font-size="20" fill="#18395f" text-anchor="middle">ทราบว่าเป็นศูนย์</text><rect x="680" y="55" width="300" height="105" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><text x="830" y="103" font-size="32" font-weight="700" fill="#18395f" text-anchor="middle">7500</text><text x="830" y="139" font-size="20" fill="#18395f" text-anchor="middle">ทราบจำนวนเงิน</text><text x="20" y="205" font-size="23" font-weight="700" fill="#18395f">x = NULL → UNKNOWN</text><text x="525" y="205" font-size="23" font-weight="700" fill="#18395f">x IS NULL → ทดสอบ NULL</text><text x="20" y="251" font-size="22" fill="#18395f">WHERE เก็บเฉพาะ TRUE</text><text x="525" y="251" font-size="22" font-weight="700" fill="#18395f">COUNT(*) = 3</text><text x="20" y="294" font-size="22" fill="#18395f">TRUE / FALSE / UNKNOWN</text><text x="525" y="294" font-size="22" font-weight="700" fill="#18395f">COUNT(approved_amount) = 2</text></g></svg>