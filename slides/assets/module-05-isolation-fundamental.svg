<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-labelledby="title desc"><title id="title">MVCC snapshot และ isolation level</title><desc id="desc">Read Committed ใช้ snapshot ต่อ statement; Repeatable Read ใช้ snapshot transaction; Serializable ให้ผลเสมือน serial และอาจต้อง retry; ทุกระดับยังเห็นการเปลี่ยนที่ทำเอง</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#2d9fe7"/></marker></defs><g font-family="Noto Sans Thai,Arial,sans-serif"><rect x="15" y="15" width="310" height="84" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><text x="32" y="64" font-size="24" fill="#18395f" font-weight="700">Read Committed</text><path d="M325 57 H365" fill="none" stroke="#2d9fe7" stroke-width="3" marker-end="url(#arrow)"/><text x="385" y="45" font-size="24" fill="#18395f" font-weight="700">snapshot ต่อ statement</text><text x="385" y="82" font-size="22" fill="#18395f">อ่านใหม่อาจเห็น commit ใหม่</text><rect x="15" y="117" width="310" height="84" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><text x="32" y="166" font-size="24" fill="#18395f" font-weight="700">Repeatable Read</text><path d="M325 159 H365" fill="none" stroke="#2d9fe7" stroke-width="3" marker-end="url(#arrow)"/><text x="385" y="147" font-size="24" fill="#18395f" font-weight="700">snapshot ของ transaction</text><text x="385" y="184" font-size="22" fill="#18395f">ตรึงเมื่อเริ่มอ่านที่ต้องใช้ snapshot</text><rect x="15" y="219" width="310" height="84" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><text x="32" y="268" font-size="24" fill="#18395f" font-weight="700">Serializable</text><path d="M325 261 H365" fill="none" stroke="#2d9fe7" stroke-width="3" marker-end="url(#arrow)"/><text x="385" y="249" font-size="24" fill="#18395f" font-weight="700">ผลเสมือนลำดับ serial</text><text x="385" y="286" font-size="22" fill="#18395f">บาง transaction ต้อง retry</text></g></svg>