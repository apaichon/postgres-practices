<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-labelledby="title desc"><title id="title">เส้นทางเชื่อมต่อผ่าน SSH</title><desc id="desc">Terminal บนเครื่องนักเรียน SSH เข้า Linux ด้วย studentxx แล้ว psql ต่อ PostgreSQL ที่ 127.0.0.1 พอร์ต 5432 ด้วย student_xx ไปยัง claimsure_xx</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#2d9fe7"/></marker></defs><g font-family="Noto Sans Thai,Arial,sans-serif"><rect x="15" y="45" width="290" height="145" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><text x="160" y="96" font-size="27" font-weight="700" fill="#18395f" text-anchor="middle">เครื่องนักเรียน</text><text x="160" y="145" font-size="19" fill="#18395f" text-anchor="middle">Terminal / PowerShell</text><rect x="355" y="45" width="290" height="145" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><text x="500" y="96" font-size="27" font-weight="700" fill="#18395f" text-anchor="middle">Linux / Bash</text><text x="500" y="145" font-size="19" fill="#18395f" text-anchor="middle">SSH: studentxx</text><rect x="695" y="45" width="290" height="145" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><text x="840" y="96" font-size="27" font-weight="700" fill="#18395f" text-anchor="middle">PostgreSQL 18</text><text x="840" y="137" font-size="21" text-anchor="middle" fill="#18395f">student_xx</text><text x="840" y="173" font-size="21" text-anchor="middle" fill="#18395f">claimsure_xx</text><path d="M305 118 H345" fill="none" stroke="#2d9fe7" stroke-width="3" marker-end="url(#arrow)"/><path d="M645 118 H685" fill="none" stroke="#2d9fe7" stroke-width="3" marker-end="url(#arrow)"/><text x="325" y="82" font-size="17" font-weight="700" fill="#18395f" text-anchor="middle">SSH</text><text x="665" y="82" font-size="17" font-weight="700" fill="#18395f" text-anchor="middle">psql</text><text x="20" y="238" font-size="22" font-weight="700" fill="#18395f">หลัง SSH: PGHOST=127.0.0.1 · PGPORT=5432 (direct connection)</text><text x="20" y="282" font-size="21" fill="#18395f">Host + Port = ตำแหน่ง server · User = ตัวตน · Database = พื้นที่ทำงานของตน</text></g></svg>