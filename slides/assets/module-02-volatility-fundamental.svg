<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-labelledby="title desc"><title id="title">Volatility ของ functions</title><desc id="desc">claim_tax ใช้ IMMUTABLE เพราะคำนวณจาก arguments; claims_by_status ใช้ STABLE เพราะอ่านข้อมูลภายใต้ snapshot ของ statement; volatility เป็นสัญญากับ planner ไม่ใช่การรับประกันความเร็ว</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#2d9fe7"/></marker></defs><g font-family="Noto Sans Thai,Arial,sans-serif"><rect x="15" y="25" width="460" height="250" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><text x="35" y="69" font-size="28" fill="#18395f" font-weight="700">IMMUTABLE</text><text x="35" y="117" font-size="22" fill="#18395f">claim_tax(...)</text><text x="35" y="160" font-size="22" fill="#18395f">คำนวณจาก arguments</text><text x="35" y="203" font-size="22" fill="#18395f">input เดิม → ผลเดิม</text><text x="35" y="246" font-size="22" fill="#18395f">ไม่อ่านตารางใน definition นี้</text><rect x="525" y="25" width="460" height="250" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><text x="545" y="69" font-size="28" fill="#18395f" font-weight="700">STABLE</text><text x="545" y="117" font-size="22" fill="#18395f">claims_by_status(...)</text><text x="545" y="160" font-size="22" fill="#18395f">อ่านข้อมูลจาก view</text><text x="545" y="203" font-size="22" fill="#18395f">snapshot ของ statement</text><text x="545" y="246" font-size="22" fill="#18395f">ไม่ได้แปลว่าผลคงเดิมตลอดไป</text></g></svg>