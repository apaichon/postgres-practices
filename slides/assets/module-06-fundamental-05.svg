<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="368" viewBox="0 0 1000 368" role="img" aria-labelledby="title desc"><title id="title">Checkpoint frequency กับปริมาณ WAL</title><desc id="desc">WAL records → รองรับ redo ของการเปลี่ยนข้อมูล; max_wal_size → soft limit ที่สัมพันธ์กับ checkpoint pressure; checkpoint_timeout → อีกเงื่อนไขของ checkpoint รอบเวลา; Larger interval → อาจมี WAL/recovery work มากขึ้นระหว่าง checkpoints</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#2d9fe7"/></marker></defs><g font-family="Noto Sans Thai,Arial,sans-serif"><rect x="15" y="10" width="300" height="76" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><path d="M315 48 H350" fill="none" stroke="#2d9fe7" stroke-width="3" marker-end="url(#arrow)"/><text x="32" y="40" font-size="22" fill="#18395f" font-weight="700">WAL records</text><text x="370" y="55" font-size="21" fill="#18395f" font-weight="700">รองรับ redo ของการเปลี่ยนข้อมูล</text><rect x="15" y="98" width="300" height="76" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><path d="M315 136 H350" fill="none" stroke="#2d9fe7" stroke-width="3" marker-end="url(#arrow)"/><text x="32" y="128" font-size="22" fill="#18395f" font-weight="700">max_wal_size</text><text x="370" y="143" font-size="21" fill="#18395f" font-weight="700">soft limit ที่สัมพันธ์กับ checkpoint pressure</text><rect x="15" y="186" width="300" height="76" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><path d="M315 224 H350" fill="none" stroke="#2d9fe7" stroke-width="3" marker-end="url(#arrow)"/><text x="32" y="216" font-size="22" fill="#18395f" font-weight="700">checkpoint_timeout</text><text x="370" y="231" font-size="21" fill="#18395f" font-weight="700">อีกเงื่อนไขของ checkpoint รอบเวลา</text><rect x="15" y="274" width="300" height="76" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><path d="M315 312 H350" fill="none" stroke="#2d9fe7" stroke-width="3" marker-end="url(#arrow)"/><text x="32" y="304" font-size="22" fill="#18395f" font-weight="700">Larger interval</text><text x="370" y="319" font-size="21" fill="#18395f" font-weight="700">อาจมี WAL/recovery work มากขึ้นระหว่าง checkpoints</text></g></svg>