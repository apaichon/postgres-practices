<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-labelledby="title desc"><title id="title">ROLLBACK VACUUM และ CHECKPOINT</title><desc id="desc">ROLLBACK ยกเลิกผล logical; VACUUM คืนพื้นที่ภายในเมื่อ versions ไม่จำเป็น; CHECKPOINT เขียน dirty pages และ recovery boundary ไม่ใช่ backup หรือการเปลี่ยน visibility</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#2d9fe7"/></marker></defs><g font-family="Noto Sans Thai,Arial,sans-serif"><rect x="15" y="15" width="310" height="84" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><text x="32" y="64" font-size="26" fill="#18395f" font-weight="700">ROLLBACK</text><path d="M325 57 H365" fill="none" stroke="#2d9fe7" stroke-width="3" marker-end="url(#arrow)"/><text x="385" y="45" font-size="23" fill="#18395f" font-weight="700">ยกเลิกผล logical ของ transaction</text><text x="385" y="82" font-size="21" fill="#18395f">ไม่ได้ย้อน WAL / sequence ทั้งหมด</text><rect x="15" y="117" width="310" height="84" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><text x="32" y="166" font-size="26" fill="#18395f" font-weight="700">VACUUM</text><path d="M325 159 H365" fill="none" stroke="#2d9fe7" stroke-width="3" marker-end="url(#arrow)"/><text x="385" y="147" font-size="23" fill="#18395f" font-weight="700">จัดการ versions ที่ไม่ต้องใช้แล้ว</text><text x="385" y="184" font-size="21" fill="#18395f">พื้นที่ใช้ซ้ำได้ · ไฟล์อาจไม่เล็กลง</text><rect x="15" y="219" width="310" height="84" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><text x="32" y="268" font-size="26" fill="#18395f" font-weight="700">CHECKPOINT</text><path d="M325 261 H365" fill="none" stroke="#2d9fe7" stroke-width="3" marker-end="url(#arrow)"/><text x="385" y="249" font-size="23" fill="#18395f" font-weight="700">เขียน dirty pages / กำหนด redo</text><text x="385" y="286" font-size="21" fill="#18395f">ไม่เปลี่ยน snapshot visibility · ไม่ใช่ backup</text></g></svg>