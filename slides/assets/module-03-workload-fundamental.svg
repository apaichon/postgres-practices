<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-labelledby="title desc"><title id="title">ขยาย workload จากเคลมเดิม</title><desc id="desc">ใช้หกเคลมเดิมเป็นแม่แบบ เพิ่ม CLM-L3 จำนวนหนึ่งแสนแถวลง claimsure.claim จริง รวมหนึ่งแสนหกแถว โดยยังใช้ลูกค้าและกรมธรรม์เดิม</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#2d9fe7"/></marker></defs><g font-family="Noto Sans Thai,Arial,sans-serif"><rect x="15" y="35" width="300" height="155" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><text x="165" y="83" font-size="28" fill="#18395f" font-weight="700" text-anchor="middle">6 เคลมเดิม</text><text x="165" y="127" font-size="22" fill="#18395f" text-anchor="middle">CLM-L1-*</text><text x="165" y="163" font-size="22" fill="#18395f" text-anchor="middle">แม่แบบจากบท 1–2</text><rect x="350" y="35" width="300" height="155" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><text x="500" y="83" font-size="28" fill="#18395f" font-weight="700" text-anchor="middle">เพิ่ม 100,000</text><text x="500" y="127" font-size="22" fill="#18395f" text-anchor="middle">CLM-L3-*</text><text x="500" y="163" font-size="22" fill="#18395f" text-anchor="middle">policy_id จากแม่แบบ</text><rect x="685" y="35" width="300" height="155" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><text x="835" y="83" font-size="28" fill="#18395f" font-weight="700" text-anchor="middle">100,006 แถว</text><text x="835" y="127" font-size="22" fill="#18395f" text-anchor="middle">claimsure.claim จริง</text><text x="835" y="163" font-size="22" fill="#18395f" text-anchor="middle">view เดิมเห็นแถวใหม่</text><path d="M315 113 H340" fill="none" stroke="#2d9fe7" stroke-width="3" marker-end="url(#arrow)"/><path d="M650 113 H675" fill="none" stroke="#2d9fe7" stroke-width="3" marker-end="url(#arrow)"/><text x="20" y="242" font-size="23" fill="#18395f" font-weight="700">customer 3 ราย / policy 3 ฉบับเดิม · CUS-003 ยังไม่มี claim</text><text x="20" y="289" font-size="22" fill="#18395f">เพิ่ม description + metadata · ตรวจแม่แบบ 6 แถวก่อน INSERT</text></g></svg>