<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc"><title id="title">Step 15 · Fundamental: Transaction pooling</title><desc id="desc">Client write endpoint → Route to the actual current primary host:port; BEGIN → SET LOCAL → Set validated context inside the transaction; COMMIT / ROLLBACK → Transaction-local context ends with transaction</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#2d9fe7"/></marker></defs><g font-family="Noto Sans Thai,Arial,sans-serif"><rect x="15" y="10" width="300" height="76" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><path d="M315 48 H350" fill="none" stroke="#2d9fe7" stroke-width="3" marker-end="url(#arrow)"/><text x="32" y="40" font-size="22" fill="#18395f" font-weight="700">Client write endpoint</text><text x="370" y="55" font-size="21" fill="#18395f" font-weight="700">Route to the actual current primary host:port</text><rect x="15" y="98" width="300" height="76" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><path d="M315 136 H350" fill="none" stroke="#2d9fe7" stroke-width="3" marker-end="url(#arrow)"/><text x="32" y="128" font-size="22" fill="#18395f" font-weight="700">BEGIN → SET LOCAL</text><text x="370" y="143" font-size="21" fill="#18395f" font-weight="700">Set validated context inside the transaction</text><rect x="15" y="186" width="300" height="76" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><path d="M315 224 H350" fill="none" stroke="#2d9fe7" stroke-width="3" marker-end="url(#arrow)"/><text x="32" y="216" font-size="22" fill="#18395f" font-weight="700">COMMIT / ROLLBACK</text><text x="370" y="231" font-size="21" fill="#18395f" font-weight="700">Transaction-local context ends with transaction</text></g></svg>