<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-labelledby="title desc"><title id="title">Invoker, definer และ audit</title><desc id="desc">Invoker ใช้สิทธิ์ผู้เรียก Definer ใช้สิทธิ์ owner พร้อม search_path และ EXECUTE ที่เหมาะสม; view security_invoker ตรวจ underlying relations ตามผู้เรียก; audit ใน transaction rollback ได้</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#2d9fe7"/></marker></defs><g font-family="Noto Sans Thai,Arial,sans-serif"><rect x="15" y="15" width="310" height="84" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><text x="32" y="64" font-size="23" fill="#18395f" font-weight="700">SECURITY INVOKER</text><path d="M325 57 H365" fill="none" stroke="#2d9fe7" stroke-width="3" marker-end="url(#arrow)"/><text x="385" y="45" font-size="24" fill="#18395f" font-weight="700">ใช้สิทธิ์ผู้เรียก</text><text x="385" y="82" font-size="21" fill="#18395f">Function / procedure ของผู้เรียก</text><rect x="15" y="117" width="310" height="84" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><text x="32" y="166" font-size="23" fill="#18395f" font-weight="700">SECURITY DEFINER</text><path d="M325 159 H365" fill="none" stroke="#2d9fe7" stroke-width="3" marker-end="url(#arrow)"/><text x="385" y="147" font-size="24" fill="#18395f" font-weight="700">ใช้สิทธิ์ owner ของ routine</text><text x="385" y="184" font-size="21" fill="#18395f">จำกัด search_path / EXECUTE</text><rect x="15" y="219" width="310" height="84" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><text x="32" y="268" font-size="23" fill="#18395f" font-weight="700">View / audit</text><path d="M325 261 H365" fill="none" stroke="#2d9fe7" stroke-width="3" marker-end="url(#arrow)"/><text x="385" y="249" font-size="24" fill="#18395f" font-weight="700">view: security_invoker=true</text><text x="385" y="286" font-size="21" fill="#18395f">audit ใน transaction เดียวกัน rollback ได้</text></g></svg>