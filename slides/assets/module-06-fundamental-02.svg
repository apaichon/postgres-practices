<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="368" viewBox="0 0 1000 368" role="img" aria-labelledby="title desc"><title id="title">Fundamentals: ขอบเขตของ setting</title><desc id="desc">Cluster default → postgresql.conf / ALTER SYSTEM → source และ effective value; Login default → ALTER DATABASE / ALTER ROLE → ใช้กับ connection ใหม่; Session / transaction → SET / SET LOCAL → ขอบเขตและการคืนค่า; Table options → autovacuum reloptions → มี override ของ table หรือไม่</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#2d9fe7"/></marker></defs><g font-family="Noto Sans Thai,Arial,sans-serif"><rect x="15" y="10" width="300" height="76" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><path d="M315 48 H350" fill="none" stroke="#2d9fe7" stroke-width="3" marker-end="url(#arrow)"/><text x="32" y="40" font-size="22" fill="#18395f" font-weight="700">Cluster default</text><text x="370" y="39" font-size="21" fill="#18395f" font-weight="700">postgresql.conf / ALTER SYSTEM</text><text x="370" y="63" font-size="21" fill="#18395f">source และ effective value</text><rect x="15" y="98" width="300" height="76" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><path d="M315 136 H350" fill="none" stroke="#2d9fe7" stroke-width="3" marker-end="url(#arrow)"/><text x="32" y="128" font-size="22" fill="#18395f" font-weight="700">Login default</text><text x="370" y="127" font-size="21" fill="#18395f" font-weight="700">ALTER DATABASE / ALTER ROLE</text><text x="370" y="151" font-size="21" fill="#18395f">ใช้กับ connection ใหม่</text><rect x="15" y="186" width="300" height="76" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><path d="M315 224 H350" fill="none" stroke="#2d9fe7" stroke-width="3" marker-end="url(#arrow)"/><text x="32" y="216" font-size="22" fill="#18395f" font-weight="700">Session / transaction</text><text x="370" y="215" font-size="21" fill="#18395f" font-weight="700">SET / SET LOCAL</text><text x="370" y="239" font-size="21" fill="#18395f">ขอบเขตและการคืนค่า</text><rect x="15" y="274" width="300" height="76" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><path d="M315 312 H350" fill="none" stroke="#2d9fe7" stroke-width="3" marker-end="url(#arrow)"/><text x="32" y="304" font-size="22" fill="#18395f" font-weight="700">Table options</text><text x="370" y="303" font-size="21" fill="#18395f" font-weight="700">autovacuum reloptions</text><text x="370" y="327" font-size="21" fill="#18395f">มี override ของ table หรือไม่</text></g></svg>