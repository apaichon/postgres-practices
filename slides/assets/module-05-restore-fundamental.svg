<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-labelledby="title desc"><title id="title">คืนสองเคลมด้วย logical key และ identity เดิม</title><desc id="desc">คืนข้อมูลจาก cs_m5_original ใน Session A โดยใช้ OVERRIDING SYSTEM VALUE และ upsert ตาม claim_no; รักษา claim_id เดิม และตรวจสองเคลมก่อนทำ WAL lab</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#2d9fe7"/></marker></defs><g font-family="Noto Sans Thai,Arial,sans-serif"><rect x="15" y="35" width="300" height="170" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><text x="165" y="82" font-size="26" fill="#18395f" font-weight="700" text-anchor="middle">ค่าเดิมใน A</text><text x="165" y="128" font-size="21" fill="#18395f" text-anchor="middle">cs_m5_original</text><text x="165" y="165" font-size="21" fill="#18395f" text-anchor="middle">เก็บ 001 และ 006</text><rect x="350" y="35" width="300" height="170" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><text x="500" y="82" font-size="26" fill="#18395f" font-weight="700" text-anchor="middle">คืนข้อมูล</text><text x="500" y="122" font-size="20" fill="#18395f" text-anchor="middle">OVERRIDING</text><text x="500" y="150" font-size="20" fill="#18395f" text-anchor="middle">SYSTEM VALUE</text><text x="500" y="185" font-size="21" fill="#18395f" text-anchor="middle">ON CONFLICT(claim_no)</text><rect x="685" y="35" width="300" height="170" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><text x="835" y="82" font-size="26" fill="#18395f" font-weight="700" text-anchor="middle">ตรวจผล</text><text x="835" y="128" font-size="21" fill="#18395f" text-anchor="middle">001: REVIEW / 15,000</text><text x="835" y="165" font-size="21" fill="#18395f" text-anchor="middle">006: REJECTED / 18,000</text><path d="M315 118 H340" fill="none" stroke="#2d9fe7" stroke-width="3" marker-end="url(#arrow)"/><path d="M650 118 H675" fill="none" stroke="#2d9fe7" stroke-width="3" marker-end="url(#arrow)"/><text x="20" y="267" font-size="23" fill="#18395f" font-weight="700">คืน claim_id เดิมให้แถวที่ลบ · ctid อาจเปลี่ยน · คง Terminal A ไว้</text></g></svg>