<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc"><title id="title">9B · Fundamental: State และ Wait</title><desc id="desc">active → กำลังทำ query และอาจรอ Lock ได้; idle in transaction → ยังมี transaction เปิด แม้ไม่มี query ใหม่; blocker PID → pg_blocking_pids(pid) ระบุผู้ขวาง</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#2d9fe7"/></marker></defs><g font-family="Noto Sans Thai,Arial,sans-serif"><rect x="15" y="10" width="300" height="76" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><path d="M315 48 H350" fill="none" stroke="#2d9fe7" stroke-width="3" marker-end="url(#arrow)"/><text x="32" y="40" font-size="22" fill="#18395f" font-weight="700">active</text><text x="370" y="55" font-size="21" fill="#18395f" font-weight="700">กำลังทำ query และอาจรอ Lock ได้</text><rect x="15" y="98" width="300" height="76" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><path d="M315 136 H350" fill="none" stroke="#2d9fe7" stroke-width="3" marker-end="url(#arrow)"/><text x="32" y="128" font-size="22" fill="#18395f" font-weight="700">idle in transaction</text><text x="370" y="143" font-size="21" fill="#18395f" font-weight="700">ยังมี transaction เปิด แม้ไม่มี query ใหม่</text><rect x="15" y="186" width="300" height="76" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><path d="M315 224 H350" fill="none" stroke="#2d9fe7" stroke-width="3" marker-end="url(#arrow)"/><text x="32" y="216" font-size="22" fill="#18395f" font-weight="700">blocker PID</text><text x="370" y="231" font-size="21" fill="#18395f" font-weight="700">pg_blocking_pids(pid) ระบุผู้ขวาง</text></g></svg>