<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-labelledby="title desc"><title id="title">Cardinality ของผลลัพธ์</title><desc id="desc">Scalar function คืนหนึ่งค่าต่อการประเมิน ส่วน set-returning function คืนศูนย์ถึงหลายแถว; GROUP BY ยุบกลุ่ม Window คงแถวใน query ตัวอย่าง</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#2d9fe7"/></marker></defs><g font-family="Noto Sans Thai,Arial,sans-serif"><text x="20" y="34" font-size="25" fill="#18395f" font-weight="700">ชนิดค่า (type) ≠ จำนวนแถว (cardinality)</text><rect x="20" y="62" width="455" height="175" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><text x="38" y="101" font-size="27" fill="#18395f" font-weight="700">Scalar function</text><text x="38" y="143" font-size="22" fill="#18395f">claim_tax(15000, NULL)</text><text x="38" y="178" font-size="22" fill="#18395f">→ numeric: 1050.00</text><text x="38" y="213" font-size="22" fill="#18395f">หนึ่งค่าต่อการประเมิน</text><rect x="525" y="62" width="455" height="175" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><text x="543" y="101" font-size="27" fill="#18395f" font-weight="700">Set-returning function</text><text x="543" y="143" font-size="22" fill="#18395f">claims_by_status(&#x27;review&#x27;)</text><text x="543" y="178" font-size="22" fill="#18395f">→ ตาราง 2 แถว ในข้อมูลแล็บ</text><text x="543" y="213" font-size="22" fill="#18395f">คืนได้ศูนย์ถึงหลายแถว</text><text x="20" y="291" font-size="22" fill="#18395f" font-weight="700">GROUP BY: 1 แถวต่อกลุ่ม · Window: คงรายละเอียดแถวใน query ตัวอย่าง</text></g></svg>