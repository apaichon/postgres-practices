<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-labelledby="title desc"><title id="title">Logical row และ physical tuple</title><desc id="desc">claim_id/claim_no เป็นตัวระบุ logical row; ctid เป็นตำแหน่ง version ที่เปลี่ยนได้; xmin/xmax ต้องดู transaction state ไม่ใช่ business status</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#2d9fe7"/></marker></defs><g font-family="Noto Sans Thai,Arial,sans-serif"><rect x="15" y="35" width="300" height="170" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><text x="165" y="82" font-size="26" fill="#18395f" font-weight="700" text-anchor="middle">Logical row</text><text x="165" y="128" font-size="20" fill="#18395f" text-anchor="middle">claim_id / claim_no</text><text x="165" y="165" font-size="20" fill="#18395f" text-anchor="middle">ตัวระบุเคลมที่งานอ้าง</text><rect x="350" y="35" width="300" height="170" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><text x="500" y="82" font-size="26" fill="#18395f" font-weight="700" text-anchor="middle">Tuple version</text><text x="500" y="128" font-size="20" fill="#18395f" text-anchor="middle">Heap page + slot</text><text x="500" y="165" font-size="20" fill="#18395f" text-anchor="middle">ctid เปลี่ยนได้</text><rect x="685" y="35" width="300" height="170" rx="10" fill="#f4faff" stroke="#78cffa" stroke-width="2"/><text x="835" y="82" font-size="26" fill="#18395f" font-weight="700" text-anchor="middle">MVCC metadata</text><text x="835" y="128" font-size="20" fill="#18395f" text-anchor="middle">xmin / xmax + flags</text><text x="835" y="165" font-size="20" fill="#18395f" text-anchor="middle">อ่านร่วมกับ transaction state</text><path d="M315 118 H340" fill="none" stroke="#2d9fe7" stroke-width="3" marker-end="url(#arrow)"/><path d="M650 118 H675" fill="none" stroke="#2d9fe7" stroke-width="3" marker-end="url(#arrow)"/><text x="20" y="267" font-size="22" fill="#18395f" font-weight="700">UPDATE อาจสร้าง version ใหม่ของเคลมเดิม · ctid ไม่ใช่ identity ของ application</text></g></svg>