listen_addresses = '*'
port = 5432
hba_file = '/lab/config/pg_hba.conf'
timezone = 'Asia/Bangkok'
log_timezone = 'Asia/Bangkok'
password_encryption = 'scram-sha-256'
shared_buffers = '32MB'
work_mem = '2MB'
max_connections = 30
wal_level = replica
max_wal_senders = 8
max_replication_slots = 8
wal_keep_size = '64MB'
max_slot_wal_keep_size = '256MB'
max_wal_size = '256MB'
min_wal_size = '80MB'
hot_standby = on
recovery_target_timeline = 'latest'
wal_log_hints = on
synchronous_commit = on
synchronous_standby_names = ''
logging_collector = off
log_line_prefix = '%m [%p] %a %u@%d '
log_replication_commands = on
