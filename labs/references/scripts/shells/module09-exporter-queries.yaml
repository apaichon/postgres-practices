# Tested with postgres_exporter v0.20.1. The custom-query interface is deprecated;
# retain this pin and test/migrate these teaching collectors before upgrading.
claimsure_m9_activity:
  query: |
    SELECT current_database() AS datname,
      count(*)::float AS sessions,
      count(*) FILTER(WHERE state='active')::float AS active,
      count(*) FILTER(WHERE state='idle in transaction')::float AS idle_in_transaction,
      count(*) FILTER(WHERE cardinality(pg_blocking_pids(pid))>0)::float AS blocked,
      coalesce(max(extract(epoch FROM clock_timestamp()-xact_start)),0)::float AS oldest_transaction_seconds,
      coalesce(max(extract(epoch FROM clock_timestamp()-query_start)) FILTER(WHERE cardinality(pg_blocking_pids(pid))>0),0)::float AS oldest_wait_seconds
    FROM pg_stat_activity
    WHERE datname=current_database()
      AND usename='student_'||right(current_database(),2)
      AND starts_with(application_name,'module09_'||right(current_database(),2)||'_')
  metrics:
    - datname: {usage: LABEL, description: Student database}
    - sessions: {usage: GAUGE, description: Tagged Module 9 clients}
    - active: {usage: GAUGE, description: Active Module 9 clients}
    - idle_in_transaction: {usage: GAUGE, description: Module 9 clients idle in a transaction}
    - blocked: {usage: GAUGE, description: Module 9 clients waiting for a blocker}
    - oldest_transaction_seconds: {usage: GAUGE, description: Oldest tagged transaction age}
    - oldest_wait_seconds: {usage: GAUGE, description: Oldest tagged blocked query age}
claimsure_m9_capacity:
  query: |
    SELECT current_database() AS datname,
      (SELECT count(*) FROM pg_stat_activity WHERE datname=current_database() AND usename='student_'||right(current_database(),2))::float AS own_role_sessions,
      coalesce((SELECT rolconnlimit FROM pg_roles WHERE rolname='student_'||right(current_database(),2)),-1)::float AS own_role_limit
  metrics:
    - datname: {usage: LABEL, description: Student database}
    - own_role_sessions: {usage: GAUGE, description: All sessions for the student's role}
    - own_role_limit: {usage: GAUGE, description: Role connection limit -1 means unlimited}
claimsure_m9_tables:
  query: |
    SELECT current_database() AS datname,relname,
      n_live_tup::float AS live_tuples,n_dead_tup::float AS dead_tuples,
      autovacuum_count::float AS autovacuums_total
    FROM pg_stat_user_tables WHERE schemaname='lab_m9_shell'
      AND relname IN ('workload','queue','lock_demo')
  metrics:
    - datname: {usage: LABEL, description: Student database}
    - relname: {usage: LABEL, description: Lab relation name}
    - live_tuples: {usage: GAUGE, description: Estimated live lab tuples}
    - dead_tuples: {usage: GAUGE, description: Estimated dead lab tuples}
    - autovacuums_total: {usage: COUNTER, description: Automatic vacuum count}
claimsure_m9_sql:
  query: |
    SELECT current_database() AS datname,s.queryid::text AS queryid,
      sum(s.calls)::float AS calls_total,
      sum(s.total_exec_time/1000)::float AS seconds_total,
      sum(s.rows)::float AS rows_total
    FROM pg_stat_statements s JOIN pg_roles r ON r.oid=s.userid
    WHERE s.dbid=(SELECT oid FROM pg_database WHERE datname=current_database())
      AND r.rolname='student_'||right(current_database(),2)
      AND s.query LIKE '%lab_m9_shell%' AND s.query NOT LIKE '%pg_stat_statements%'
    GROUP BY s.queryid
  metrics:
    - datname: {usage: LABEL, description: Student database}
    - queryid: {usage: LABEL, description: Normalized SQL query identifier - no query text}
    - calls_total: {usage: COUNTER, description: Lab SQL execution count}
    - seconds_total: {usage: COUNTER, description: Lab SQL execution time in seconds}
    - rows_total: {usage: COUNTER, description: Rows processed by lab SQL}
